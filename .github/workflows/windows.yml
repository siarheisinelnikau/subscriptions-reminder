name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish executable release assets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
          rustup default 1.96.1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Check code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build portable executable
        env:
          SUBSCRIPTIONS_GOOGLE_OAUTH_JSON: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.GOOGLE_DESKTOP_OAUTH_JSON || '' }}
          SUBSCRIPTIONS_REQUIRE_GOOGLE_OAUTH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && '1' || '' }}
        run: cargo build --release --locked
      - name: Package executable and checksums
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish a new version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const publish = require('./scripts/publish-release.cjs');
            await publish({github, context, core});
