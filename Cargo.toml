[package]
name = "subscriptions-reminder"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
description = "A portable Windows subscription tracker with background reminders"
license = "MIT"
repository = "https://github.com/siarheisinelnikau/subscriptions-reminder"

[dependencies]
rust-auto-updator = { path = "../rust-auto-updator/crates/rust-auto-updator" }
anyhow = "1.0"
bytemuck = "1.0"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "links"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
softbuffer = { version = "=0.4.8", default-features = false }
fs2 = "0.4.3"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
raw-window-handle = "0.6.2"
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3.27.0"
ureq = { version = "3.5.0", features = ["json"] }
url = "2.5.8"
uuid = { version = "1.26", features = ["v4", "serde"] }
webbrowser = "1.2.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[build-dependencies]
serde_json = "1.0"
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
